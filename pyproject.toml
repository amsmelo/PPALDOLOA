[project]
name = "govtech-ppaldoloa"
version = "0.1.0"
description = "Sistema Modular de Gestão de Planejamento, Orçamento e Finanças Públicas Municipais (PPA, LDO, LOA)"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
authors = [
    { name = "GovTech Architecture Team", email = "arquitetura@govtech.local" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.3,<2.0.0",
    "greenlet>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "factory-boy>=3.3.1,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.poetry]
name = "govtech-ppaldoloa"
version = "0.1.0"
description = "Sistema Modular de Gestão de Planejamento, Orçamento e Finanças Públicas Municipais (PPA, LDO, LOA)"
authors = ["GovTech Architecture Team <arquitetura@govtech.local>"]
readme = "ARCHITECTURE.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
alembic = "^1.13.3"
greenlet = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
factory-boy = "^3.3.1"
aiosqlite = "^0.20.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/modules"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
